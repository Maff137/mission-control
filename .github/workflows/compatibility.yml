name: Desktop compatibility

on:
  push:
    branches: [main, test/b6-platform-compatibility]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev
      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.99.1
      - name: Record environment
        run: |
          node --version
          npm --version
          rustc -Vv
          cargo --version
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run rust:check
      - run: npm run rust:test
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - name: Package unsigned application (no native launch)
        run: npm run desktop:build -- -- --locked
      # No release, upload, signing credentials, user data or executable launch.
